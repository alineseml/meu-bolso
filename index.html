<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="description" content="Seu dinheiro, sem mistério. Organize receitas, despesas fixas, variáveis, eventuais, cartões e metas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Meu Bolso ✨</title>
<style>
:root{--ink:#30283b;--muted:#83788e;--pink:#f7b8d5;--purple:#c9b8ff;--mint:#bdebd8;--yellow:#ffe7a3;--blue:#bddcff;--bg:#fff9fc;--card:#fff;--line:#f0e7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 14px}.brand{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:1.2px}.hello{font-size:25px;font-weight:850;margin-top:5px}.avatar{background:var(--yellow);width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:25px}.hero{padding:22px;border-radius:27px;background:linear-gradient(135deg,#f9c5df,#d8caff);box-shadow:0 8px 24px #e9d3e7aa}.hero small{font-weight:700;color:#5b4567}.balance{font-size:35px;font-weight:900;margin:8px 0 16px;letter-spacing:-1px}.herofoot{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:700}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 23px}.metric{background:white;border:1px solid var(--line);border-radius:20px;padding:15px}.emoji{width:37px;height:37px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:12px}.metric small{display:block;color:var(--muted);font-weight:650}.amount{font-size:19px;font-weight:850;margin-top:5px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px}.sectionhead h2{font-size:18px;margin:0}.link{background:none;color:#9c4c82;font-weight:800;font-size:13px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{background:white;border:1px solid var(--line);border-radius:17px;padding:13px 3px 11px;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:11px;font-weight:750}.action span:first-child{font-size:22px}.budget{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}.budgetrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.budgetrow strong{font-size:14px}.budgetrow small{color:var(--muted)}.track{height:8px;border-radius:9px;background:#f2edf3;margin-top:12px;overflow:hidden}.fill{height:100%;border-radius:9px;background:#c7b5ff}.tx{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}.txicon{width:43px;height:43px;display:grid;place-items:center;border-radius:15px;font-size:21px;background:#fce3ef}.txmain{flex:1;min-width:0}.txmain strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain small{color:var(--muted)}.txamount{font-weight:850}.empty{padding:18px;color:var(--muted);text-align:center;background:#fff;border-radius:16px}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5}.navinner{width:100%;max-width:560px;display:flex;justify-content:space-around}.nav button{background:none;color:var(--muted);font-size:11px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 10px}.nav button span{font-size:20px}.nav button.active{color:#a34880}.fab{position:fixed;right:max(20px,calc((100vw - 560px)/2 + 20px));bottom:90px;border-radius:20px;width:58px;height:58px;font-size:28px;background:#9b65d7;color:white;box-shadow:0 8px 20px #b69bd988;z-index:4}.modalback{position:fixed;inset:0;background:#2e1e38a0;z-index:10;display:none;align-items:flex-end;justify-content:center}.modalback.open{display:flex}.modal{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{margin:0;font-size:22px}.close{background:#f1e6f0;border-radius:12px;padding:8px 12px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #e8dce8;border-radius:13px;background:white;color:var(--ink)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;background:#9b65d7;color:white;font-weight:850;padding:15px;border-radius:15px;margin-top:10px}.pill{background:#f4e7f3;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}.note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:15px}.hidden{display:none!important}.listitem{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;display:flex;justify-content:space-between;gap:10px}.listitem button{background:#ffe3ec;border-radius:10px;padding:6px 9px}.smallbtn{background:#eee6ff;border-radius:10px;padding:8px;font-weight:750}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">MEU BOLSO ✨</div><div class="hello" id="greeting">Seu dinheiro, sem mistério!</div></div><div class="avatar">🐱</div></header>
<main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Adicionar lançamento">＋</button>
<nav class="nav"><div class="navinner">
<button class="active" data-tab="home"><span>🏠</span>Início</button><button data-tab="transactions"><span>🧾</span>Lançamentos</button><button data-tab="cards"><span>💳</span>Cartões</button><button data-tab="planning"><span>🎯</span>Planejar</button>
</div></nav>
<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2 id="modalTitle">Novo lançamento</h2><button class="close" id="close">Fechar ✕</button></div><div id="modalContent"></div></section></div>
<script>
const KEY='meubolso_v1';
const IMPORT_FORMAT='meu-bolso-notion-import-v1';
const cats={Alimentação:'🍓', 'Restaurante/Ifood':'🍜',Transporte:'🚌',Moradia:'🏡',Saúde:'🩷','Saúde e Farmácia':'💊',Lazer:'🎟️',Compras:'🛍️',Educação:'📚',Assinatura:'🎧',Assinaturas:'🎧',Salário:'💸',Freelance:'💻',Investimentos:'🌱',Outros:'✨',Transferência:'🔄',Pets:'🐈',Mercado:'🛒',Vestuário:'👕',Viagem:'✈️',Casa:'🏠'};
let state=load(),tab='home';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY))||{};return {transactions:[],cards:[],budgets:[],purchases:[],importedHistory:[],...x}}catch(e){return {transactions:[],cards:[],budgets:[],purchases:[],importedHistory:[]}}}
function save(){if(!state.purchases)state.purchases=[];if(!state.importedHistory)state.importedHistory=[];localStorage.setItem(KEY,JSON.stringify(state));render()}
function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dateISO(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthTx(){let m=dateISO().slice(0,7);return state.transactions.filter(t=>t.date?.slice(0,7)===m)}
function totals(){let a=monthTx(),income=a.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense=a.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);return {income,expense,net:income-expense}}
function signed(t){return (t.type==='income'?'+':'−')+money(t.amount)}
function expenseTypeLabel(v){return ({fixed:'Fixa',variable:'Variável',eventual:'Eventual'})[v]||'Não classificada'}
function expenseTypeOptions(){return '<option value="variable">Variável</option><option value="fixed">Fixa</option><option value="eventual">Eventual</option>'}
function txHtml(t){return `<div class="tx"><div class="txicon">${cats[t.category]||'✨'}</div><div class="txmain"><strong>${esc(t.description||t.category)}</strong><small>${esc(t.category)}${t.expenseType?' · '+esc(expenseTypeLabel(t.expenseType)):''} · ${new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')}</small></div><div class="txamount" style="color:${t.type==='income'?'#18835e':'#a34b79'}">${signed(t)}</div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let root=document.getElementById('main');if(tab==='home')root.innerHTML=home();else if(tab==='transactions')root.innerHTML=transactionsPage();else if(tab==='cards')root.innerHTML=cardsPage();else root.innerHTML=planningPage()}
function home(){let t=totals(),recent=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return `<section class="hero"><small>VISÃO DO MÊS · ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase()}</small><div class="balance">${money(t.net)}</div><div class="herofoot"><span>✨ Saldo do mês (receitas − despesas)</span><span class="pill">💜 Em dia</span></div></section><div class="metrics"><div class="metric"><div class="emoji" style="background:#d8f6e8">📥</div><small>Receitas do mês</small><div class="amount">${money(t.income)}</div></div><div class="metric"><div class="emoji" style="background:#ffe0ee">🛍️</div><small>Despesas do mês</small><div class="amount">${money(t.expense)}</div></div></div><div class="sectionhead"><h2>Atalhos mágicos ✨</h2></div><div class="actions"><button class="action" data-action="expense"><span>🛍️</span>Despesa</button><button class="action" data-action="income"><span>💸</span>Receita</button><button class="action" data-action="card"><span>💳</span>Cartão</button><button class="action" data-action="budget"><span>🎯</span>Orçamento</button></div><div class="sectionhead"><h2>Últimos movimentos</h2><button class="link" data-goto="transactions">Ver todos →</button></div>${recent.length?recent.map(txHtml).join(''):'<div class="empty">🌷 Seu primeiro lançamento começa aqui!<br>Toque no + para registrar uma receita ou despesa.</div>'}<p class="note">O saldo exibido é o resultado das movimentações registradas neste mês, não o saldo bancário real.</p>`}
function transactionsPage(){let arr=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="sectionhead"><h2>Seus lançamentos 🧾</h2><button class="smallbtn" data-action="expense">＋ Novo</button></div>${arr.length?arr.map(t=>`<div class="listitem"><div style="display:flex;gap:10px;align-items:center;min-width:0"><span style="font-size:22px">${cats[t.category]||'✨'}</span><div><strong>${esc(t.description||t.category)}</strong><div style="font-size:12px;color:var(--muted)">${esc(t.category)}${t.expenseType?' · '+esc(expenseTypeLabel(t.expenseType)):''} · ${new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')}</div><b style="color:${t.type==='income'?'#18835e':'#a34b79'}">${signed(t)}</b></div></div><button data-delete="${t.id}">Excluir</button></div>`).join(''):'<div class="empty">Ainda não há lançamentos. Adicione o primeiro! 🌈</div>'}<div class="sectionhead"><h2>Histórico importado do Notion (${(state.importedHistory||[]).length})</h2></div>${(state.importedHistory||[]).length?`<p class="note">Histórico importado em arquivo separado; não é somado automaticamente ao resumo mensal para evitar duplicar lançamentos já cadastrados. Parcelas no cartão aparecem na previsão da fatura do respectivo mês.</p><div style="max-height:340px;overflow:auto">${(state.importedHistory||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,100).map(r=>`<div class="listitem"><div><strong>${esc(r.description)}</strong><div style="font-size:12px;color:var(--muted)">${esc(r.date||'Data pendente')} · ${esc(r.category)} · ${esc(r.expenseType?expenseTypeLabel(r.expenseType):'Não classificada')} · ${esc(r.paymentMethod)}</div><b>${r.amount===null?'Valor pendente':money(r.amount)}</b>${r.needsReview?'<div style="font-size:11px;color:#a34b79">Precisa de revisão</div>':''}</div></div>`).join('')}</div>${(state.importedHistory||[]).length>100?`<p class="note">Exibindo os 100 registros mais recentes de ${(state.importedHistory||[]).length}.</p>`:''}`:'<div class="empty">Ainda não importou seu histórico do Notion.</div>'}<p class="note">Dica: registre compras novas aqui. Para cartão de crédito, escolha o cartão e as parcelas; o histórico importado fica separado para não duplicar despesas.</p>`}
function invoiceMonthFor(purchaseDate, closeDay, installmentOffset=0){
 let d=new Date(purchaseDate+'T12:00:00');
 if(d.getDate()>Number(closeDay||31)) d.setMonth(d.getMonth()+1);
 d.setMonth(d.getMonth()+installmentOffset);
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function invoiceFor(cardId, month){
 let card=state.cards.find(c=>c.id===cardId);
 if(!card) return [];
 const generated=(state.purchases||[]).filter(p=>p.cardId===cardId).flatMap(p=>{
   let count=Math.max(1,Number(p.installments||1));
   let part=Number(p.amount)/count;
   return Array.from({length:count},(_,i)=>({p,i,part,month:invoiceMonthFor(p.date,card.close,i),source:'app'})).filter(x=>x.month===month);
 });
 const imported=(state.importedHistory||[]).filter(r=>r.date && r.date.slice(0,7)===month && ['cartão de crédito','pix no crédito'].includes(String(r.paymentMethod||'').toLocaleLowerCase('pt-BR')) && String(r.cardName||'').trim().toLocaleLowerCase('pt-BR')===String(card.name||'').trim().toLocaleLowerCase('pt-BR') && Number(r.amount)<0).map(r=>({p:{id:r.importId,description:r.description,date:r.date,category:r.category,imported:true,originId:r.originId},i:Math.max(0,Number(r.installmentNumber||1)-1),part:Math.abs(Number(r.amount)),month,source:'import'}));
 return [...generated,...imported];
}
function cardsPage(){
 let month=dateISO().slice(0,7);
 let purchases=state.purchases||[];
 let imported=(state.importedHistory||[]);
 return `<div class="sectionhead"><h2>Meus cartões 💳</h2><button class="smallbtn" data-action="card">＋ Cartão</button></div>
 <div class="actions" style="margin-bottom:18px"><button class="action" data-action="purchase"><span>🛍️</span>Compra no cartão</button><button class="action" data-action="card"><span>💳</span>Novo cartão</button><button class="action" data-goto="planning"><span>🎯</span>Orçamento</button><button class="action" data-action="export"><span>📦</span>Backup</button></div>
 ${state.cards.length?state.cards.map(c=>{
   let items=invoiceFor(c.id,month),total=items.reduce((s,x)=>s+x.part,0);
   let used=purchases.filter(p=>p.cardId===c.id).reduce((s,p)=>s+Number(p.amount),0);
   return `<div class="budget" style="background:linear-gradient(135deg,#d8caff,#f9c5df)"><div class="budgetrow"><strong>💳 ${esc(c.name)}</strong><span class="pill">Vence dia ${esc(c.due)}</span></div><div class="amount">${money(total)}</div><small>Fatura estimada do mês · Fecha dia ${esc(c.close)}</small><div class="budgetrow" style="margin-top:10px"><small>Limite: ${money(c.limit)}</small><small>Compras registradas: ${money(used)}</small></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="smallbtn" data-card-details="${c.id}">Ver compras</button><button class="smallbtn" data-delete-card="${c.id}">Remover cartão</button></div></div>`;
 }).join(''):'<div class="empty">💌 Adicione seu primeiro cartão para começar a organizar as faturas.</div>'}
 <div class="sectionhead"><h2>Compras registradas 🧾</h2></div>
 ${purchases.length?purchases.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{let card=state.cards.find(c=>c.id===p.cardId);return `<div class="listitem"><div><strong>${esc(p.description)}</strong><div style="font-size:12px;color:var(--muted)">${esc(card?.name||'Cartão removido')} · ${new Date(p.date+'T12:00:00').toLocaleDateString('pt-BR')}</div><div style="font-size:12px;color:var(--muted)">${esc(p.category||'Sem categoria')} · ${expenseTypeLabel(p.expenseType)}</div><div style="font-size:12px;color:var(--muted)">${p.installments>1?`${p.installments}x de ${money(p.amount/p.installments)}`:'À vista'}</div><b>${money(p.amount)}</b></div><button data-delete-purchase="${p.id}">Excluir</button></div>`}).join(''):'<div class="empty">Suas compras no cartão aparecerão aqui.</div>'}
 <div class="sectionhead"><h2>Próximas faturas 📆</h2></div>${state.cards.length?state.cards.map(c=>{let future=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);let m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return {month:m,total:invoiceFor(c.id,m).reduce((sum,x)=>sum+x.part,0)}}).filter(x=>x.total>0);return `<div class="budget"><strong>${esc(c.name)}</strong>${future.length?future.map(x=>`<div class="budgetrow" style="padding-top:8px"><small>${new Date(x.month+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</small><b>${money(x.total)}</b></div>`).join(''):'<p class="note">Nenhuma fatura prevista nos próximos seis meses.</p>'}</div>`}).join(''):''}
 <p class="note">As parcelas importadas do Notion são tratadas como valores mensais já individualizados, usando o mês da linha como mês de cobrança. Compras novas continuam sendo distribuídas pelo fechamento do cartão. Confira sempre com a fatura oficial. O pagamento de fatura ainda não é registrado como uma operação conciliada nesta versão.</p>`;
}
function planningPage(){return `<div class="sectionhead"><h2>Orçamento & metas 🎯</h2><button class="smallbtn" data-action="budget">＋ Limite</button></div>${state.budgets.length?state.budgets.map(b=>{let spent=monthTx().filter(t=>t.type==='expense'&&t.category===b.category).reduce((s,t)=>s+t.amount,0),pct=Math.min(100,b.limit?spent/b.limit*100:0);return `<div class="budget"><div class="budgetrow"><strong>${cats[b.category]||'✨'} ${esc(b.category)}</strong><span class="pill">${Math.round(pct)}%</span></div><div class="budgetrow" style="margin-top:7px"><small>${money(spent)} usados</small><small>Limite ${money(b.limit)}</small></div><div class="track"><div class="fill" style="width:${pct}%;background:${pct>=100?'#ef8cae':'#bda8f7'}"></div></div><div style="text-align:right;margin-top:10px"><button class="smallbtn" data-delete-budget="${b.id}">Remover</button></div></div>`}).join(''):'<div class="empty">🌱 Crie limites por categoria para acompanhar seu orçamento.</div>'}<div class="sectionhead"><h2>Resumo deste mês</h2></div><div class="budget">${Object.entries(totals()).map(([k,v])=>`<div class="budgetrow" style="padding:8px 0"><strong>${({income:'📥 Receitas',expense:'📤 Despesas',net:'💜 Resultado'})[k]}</strong><span>${money(v)}</span></div>`).join('')}</div><button class="primary" data-action="import">Importar histórico do Notion (JSON)</button><button class="primary" data-action="export">Exportar meus dados (JSON)</button><p class="note">O histórico importado fica separado dos lançamentos novos para evitar somar as mesmas despesas duas vezes. A importação é idempotente por ID de origem e pode ser desfeita removendo o lote importado. Os dados ficam salvos neste navegador, sem sincronização na nuvem; exporte um backup periodicamente. Agora cada despesa pode ser classificada como fixa, variável ou eventual.</p>`}
function openModal(kind='expense'){let title={expense:'Nova despesa 🛍️',income:'Nova receita 💸',card:'Adicionar cartão 💳',budget:'Criar limite 🎯',export:'Exportar dados'}[kind]||'Novo lançamento';document.getElementById('modalTitle').textContent=title;let c=document.getElementById('modalContent');if(kind==='card'){c.innerHTML=`<form id="cardForm"><label class="field"><span>Nome do cartão</span><input name="name" placeholder="Ex.: Cartão principal" required></label><div class="twocol"><label class="field"><span>Limite (R$)</span><input name="limit" type="number" min="0" step=".01" required></label><label class="field"><span>Fatura inicial (R$)</span><input name="bill" type="number" min="0" step=".01" value="0" required><small style="color:var(--muted)">Informativo; a estimativa será calculada pelas compras registradas.</small></label></div><div class="twocol"><label class="field"><span>Fecha dia</span><input name="close" type="number" min="1" max="31" required></label><label class="field"><span>Vence dia</span><input name="due" type="number" min="1" max="31" required></label></div><button class="primary">Salvar cartão</button></form>`;document.getElementById('cardForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.cards.push({id:crypto.randomUUID(),name:f.get('name'),limit:+f.get('limit'),bill:+f.get('bill'),close:f.get('close'),due:f.get('due')});closeModal();save()};}
else if(kind==='purchase'){
 if(!state.cards.length){closeModal();alert('Cadastre um cartão antes de registrar uma compra.');openModal('card');return;}

else if(kind==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-bolso-backup.json';a.click();URL.revokeObjectURL(url);closeModal();return;}
else if(kind==='import'){
 c.innerHTML=`<p class="note">Antes de importar, exporte um backup em Planejar. Escolha o arquivo <b>importacao_notion.json</b> que acompanha esta versão. Os registros serão guardados como histórico, sem transformar cada parcela em uma nova compra parcelada.</p><label class="field"><span>Arquivo de migração</span><input id="importFile" type="file" accept="application/json,.json" required></label><div id="importPreview" class="empty">Selecione o arquivo para conferir os dados antes de importar.</div><button id="confirmImport" class="primary" disabled>Importar histórico</button><button id="undoImport" class="primary" style="background:#f4e7f3;color:#6e3b69">Desfazer última importação</button>`;
 let payload=null;
 document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];payload=null;if(!file)return;try{let parsed=JSON.parse(await file.text());if(parsed.format!==IMPORT_FORMAT||!Array.isArray(parsed.records))throw new Error('Formato não reconhecido. Use o importacao_notion.json que acompanha o pacote.');payload=parsed;let existing=new Set((state.importedHistory||[]).map(r=>r.originId));let fresh=parsed.records.filter(r=>r.originId&&!existing.has(r.originId));let pending= fresh.filter(r=>r.needsReview).length;document.getElementById('importPreview').innerHTML=`<b>Prévia da importação</b><br>${parsed.records.length} registros no arquivo<br>${fresh.length} registros novos<br>${parsed.records.length-fresh.length} já importados e serão ignorados<br>${pending} registros novos com pendências<br><small>Os registros com pendências serão preservados, mas não entrarão no cálculo de faturas se não tiverem data ou valor.</small>`;document.getElementById('confirmImport').disabled=false;}catch(err){document.getElementById('importPreview').textContent='Não foi possível ler o arquivo: '+err.message;document.getElementById('confirmImport').disabled=true;}};
 document.getElementById('confirmImport').onclick=()=>{if(!payload){alert('Selecione um arquivo válido primeiro.');return}let existing=new Set((state.importedHistory||[]).map(r=>r.originId));let batch='notion-'+Date.now();let fresh=payload.records.filter(r=>r.originId&&!existing.has(r.originId)).map(r=>({...r,expenseType:r.expenseType||(String(r.movementType||'').toLocaleLowerCase('pt-BR').includes('fixa')?'fixed':String(r.movementType||'').toLocaleLowerCase('pt-BR').includes('variável')||String(r.movementType||'').toLocaleLowerCase('pt-BR').includes('variavel')?'variable':String(r.movementType||'').toLocaleLowerCase('pt-BR').includes('eventual')?'eventual':null),importId:crypto.randomUUID(),importBatch:batch}));state.importedHistory=[...(state.importedHistory||[]),...fresh];state.lastImportBatch=batch;state.lastImportCount=fresh.length;save();closeModal();alert(`Importação concluída: ${fresh.length} registros novos. Os IDs já existentes foram ignorados.`);};
 document.getElementById('undoImport').onclick=()=>{if(!state.lastImportBatch){alert('Não há uma última importação registrada para desfazer.');return}if(confirm('Desfazer somente o último lote importado? Seus lançamentos e compras novas não serão alterados.')){state.importedHistory=(state.importedHistory||[]).filter(r=>r.importBatch!==state.lastImportBatch);state.lastImportBatch=null;state.lastImportCount=0;save();closeModal();alert('Último lote importado removido.');}};

<div id="paymentFields" class="${kind==='income'?'hidden':''}">
<label class="field"><span>Como você pagou?</span><select name="paymentMethod" id="paymentMethod"><option value="other">Conta, débito, dinheiro ou Pix</option><option value="card">Cartão de crédito</option></select></label>
<div id="cardFields" class="hidden">
${state.cards.length?`<label class="field"><span>Qual cartão?</span><select name="cardId">${state.cards.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`:`<div class="empty">Você ainda não cadastrou um cartão. Cadastre um na aba Cartões antes de escolher cartão de crédito. 💳</div>`}
<label class="field"><span>Parcelamento</span><select name="installments">${Array.from({length:24},(_,i)=>`<option value="${i+1}">${i+1===1?'À vista':i+1+' parcelas'}</option>`).join('')}</select></label>
</div></div>
<button class="primary">Salvar lançamento ✨</button></form>`;
const txForm=document.getElementById('txForm'),typeSelect=document.getElementById('txType'),methodSelect=document.getElementById('paymentMethod'),paymentFields=document.getElementById('paymentFields'),cardFields=document.getElementById('cardFields'),expenseNatureField=document.getElementById('expenseNatureField');
function syncPaymentFields(){if(paymentFields)paymentFields.classList.toggle('hidden',typeSelect.value!=='expense');if(cardFields)cardFields.classList.toggle('hidden',typeSelect.value!=='expense'||methodSelect.value!=='card');if(expenseNatureField)expenseNatureField.classList.toggle('hidden',typeSelect.value!=='expense')}
typeSelect.onchange=syncPaymentFields;if(methodSelect)methodSelect.onchange=syncPaymentFields;syncPaymentFields();
txForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type'),method=f.get('paymentMethod')||'other',amount=+f.get('amount'),description=f.get('description').trim(),date=f.get('date');
if(type==='expense'&&method==='card'){
 if(!state.cards.length){alert('Cadastre um cartão primeiro na aba Cartões.');return}
 if(!f.get('cardId')){alert('Escolha o cartão usado nesta compra.');return}
 if(!state.purchases)state.purchases=[];
 state.purchases.push({id:crypto.randomUUID(),description,amount,date,cardId:f.get('cardId'),installments:+(f.get('installments')||1),category:f.get('category'),expenseType:f.get('expenseType')||'variable'});
}else{
 state.transactions.push({id:crypto.randomUUID(),description,amount,date,category:f.get('category'),type,expenseType:type==='expense'?(f.get('expenseType')||'variable'):null});
}
closeModal();save()};}
document.getElementById('modalback').classList.add('open')}
